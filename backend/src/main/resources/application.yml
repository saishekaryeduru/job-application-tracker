spring:
  application:
    name: job-tracker
  datasource:
    # Production default: PostgreSQL. Override with DB_URL / DB_USERNAME / DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DB_USERNAME:jobtracker}
    password: ${DB_PASSWORD:jobtracker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    # Override in every real deployment; a long random string is required.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    com.saishekar.jobtracker: INFO

---
# Dev profile: in-memory H2, schema created by Hibernate (no Flyway), SQL visible.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:jobtracker;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
logging:
  level:
    com.saishekar.jobtracker: DEBUG

---
# Test profile: same lightweight setup as dev.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:jobtracker-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
