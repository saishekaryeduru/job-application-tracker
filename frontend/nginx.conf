# Serves the built SPA and proxies API calls to the backend service.
# Keeping /api on the same origin means the frontend needs no CORS
# configuration and no build-time API URL -- the same relative paths work
# behind the Vite dev proxy and behind nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets change name when their content changes, so they
    # can be cached aggressively; index.html must not be cached or clients
    # would keep pointing at bundles from a previous deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
